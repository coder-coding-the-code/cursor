[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-firewall"
version = "0.1.0"
description = "ECS Guardian Semantic — Semantic Pipeline Vulnerability Filter（语义防火墙）"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ECS Security Skill Factory" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "ftfy>=6.2.0",
  "confusable-homoglyphs>=3.3.0",
  "rdflib>=7.1.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "detect-secrets>=1.5.0",
  "yara-python>=4.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]

[project.scripts]
semantic-firewall = "semantic_firewall.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semantic_firewall = ["web/*", "signatures/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
