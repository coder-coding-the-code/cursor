[project]
name = "hidden-instruction"
version = "0.1.0"
description = "Detect instructions concealed from human readers before they are used as tool parameters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "hidden-instruction" }]

[project.scripts]
hidden-instruction = "hidden_instruction.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
