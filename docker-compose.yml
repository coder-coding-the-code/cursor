services:
  guardian-trust:
    build: .
    ports:
      - "8080:8080"
    environment:
      GUARDIAN_HOST: 0.0.0.0
      GUARDIAN_PORT: 8080
    volumes:
      - ./data:/app/data

  openfga:
    image: openfga/openfga:v1.8.16
    command: run
    ports:
      - "8081:8080"
      - "8082:3000"
    profiles: ["openfga"]
